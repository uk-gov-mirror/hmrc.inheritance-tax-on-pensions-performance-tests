 # Example
   # Give a name to the journey.

 journeys {

   # Defines a simple journey to log in and view the submissions page.
   psa-view-submissions-journey-with-organisation = {
     description = "PSA View Submissions Journey with Organisation"
     load = 0.8
     parts = [ psa-view-submissions with Organisation] # This MUST match the ID in your Scala setup()
   }

   psa-view-submissions-for-an-organisation-with-beneficiary-type-of-organisation = {
      description = "PSA View Submissions for an Organisation with beneficiary type of Organisation"
      load = 0.8
      parts = [ psa-view-submissions-for-an-organisation-with-beneficiary-type-of-organisation] # This MUST match the ID in your Scala setup()
     }

   psp-view-submissions-journey-with-organisation = {
      description = "PSP View Submissions Journey with Organisation"
      load = 0.8
      parts = [ psp-view-submissions with Organisation] # This MUST match the ID in your Scala setup()
                     }
   psa-view-submissions-journey-with-Individual = {
      description = "PSA View Submissions Journey with Individual"
      load = 0.8
      parts = [ psa-view-submissions with Individual] # This MUST match the ID in your Scala setup()
           }

   psp-view-submissions-journey-with-Individual = {
     description = "PSP View Submissions Journey with Individual"
     load = 0.8
     parts = [ psp-view-submissions with Individual] # This MUST match the ID in your Scala setup()
           }

   psa-view-paid-reports = {
      description = "PSA View Paid Reports"
      load = 0.8
      parts = [ psa-view-paid-reports] # This MUST match the ID in your Scala setup()
         }

   psp-view-paid-reports = {
      description = "PSP View Paid Reports"
      load = 0.8
      parts = [ psp-view-paid-reports] # This MUST match the ID in your Scala setup()
           }

 }

journeysToRun = [
    psa-view-submissions-journey-with-organisation
    psa-view-submissions-for-an-organisation-with-beneficiary-type-of-organisation
    psp-view-submissions-journey-with-organisation
    psa-view-submissions-journey-with-Individual
    psa-view-paid-reports
    psp-view-paid-reports
]


# Specifies which of the above journeys to run.



    # The description will appear in the test report. Use something meaningful
    #  description = "psr journey"

    #  # The load is in journeys per second. Put here the load you are going to have at the peak.
    #  # There is no need to put a higher value at this point. Use prerftest.loadPercentage in application.conf instead
    #  load = 1

    #  # This points to a csv file with the data you need to inject in the journey. [More here](https://github.com/hmrc/performance-test-runner#step-4-configure-the-user-feeder)
    #  feeder = data/example.csv

    #  # The parts your journey is made of. A part is made one or more requests.
    #  parts = [
    #    PSR - Journey
    #  ]
    #}